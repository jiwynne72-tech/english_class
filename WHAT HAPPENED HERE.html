// Logic is preserved but updated for UI triggers
let currentLevel = null;
let currentIndex = 0;
let audioUnlocked = false;

function unlockAudio() {
    if (audioUnlocked) return;
    const sounds = ["soundReveal", "soundNext", "soundHover"];
    sounds.forEach(id => {
        const s = document.getElementById(id);
        s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(() => {});
    });
    audioUnlocked = true;
}

function playSound(id) {
    unlockAudio();
    const sound = document.getElementById(id);
    if (sound) {
        sound.currentTime = 0;
        sound.volume = 0.4;
        sound.play().catch(() => {});
    }
}

function showHome() {
    document.body.className = "home";
    document.getElementById("app").innerHTML = `
        <h1 style="color: var(--accent-gold)">WHAT HAPPENED HERE?? 🤔</h1>
        <div class="card">
            <p style="color: var(--text-dim); margin-bottom: 30px;">Can you spot the grammatical error?</p>
            <button class="level-btn" onmouseover="playSound('soundHover')" onclick="startGame(1)">Easy</button>
            <button class="level-btn" onmouseover="playSound('soundHover')" onclick="startGame(2)">Harder</button>
            <button class="level-btn" onmouseover="playSound('soundHover')" onclick="startGame(3)">Hard</button>
        </div>
    `;
}

function startGame(level) {
    unlockAudio();
    currentLevel = level;
    currentIndex = 0;
    document.body.className = "level" + level;
    showQuestion();
}

function showQuestion() {
    const item = data[currentLevel][currentIndex];
    document.getElementById("app").innerHTML = `
        <div style="position: relative;">
            <button class="level-btn" style="width: auto; margin-bottom: 20px; font-size: 0.8rem; padding: 10px 20px;" onclick="showHome()">
                🏠 Back to Start
            </button>
            
            <h1>Level ${currentLevel}</h1>
            <div class="card">
                <div class="sentence">${item.sentence}</div>
                <button id="resolveBtn" class="action-btn" onclick="resolve()">Resolve Error</button>
                <div class="answer" id="answer">${item.answer}</div>
                <button id="nextBtn" class="next-btn" onclick="next()">Next Sentence →</button>
            </div>
            <p style="margin-top: 20px; color: var(--text-dim); font-size: 0.9rem;">
                Question ${currentIndex + 1} of ${data[currentLevel].length}
            </p>
        </div>
    `;
}

function resolve() {
    document.getElementById("answer").style.display = "block";
    document.getElementById("resolveBtn").style.display = "none";
    document.getElementById("nextBtn").style.display = "block";
    playSound("soundReveal");
}

function next() {
    playSound("soundNext");
    currentIndex++;
    if (currentIndex >= data[currentLevel].length) {
        showHome();
    } else {
        showQuestion();
    }
}

showHome();
