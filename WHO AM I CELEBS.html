// ================= AUTO TAG =================
function getCategory(name){
    name = name.toLowerCase();

    if (["messi","ronaldo","mbapp","neymar","haaland","modric","bellingham","kane","saka","lewandowski","osimhen","vinícius","donnarumma","chiellini"].some(n=>name.includes(n))) return "football";

    if (["depp","radcliffe","reynolds","jackman","evans","johnson","diesel","reeves","holland","hemsworth","pattinson","ferrell","atkinson","hart"].some(n=>name.includes(n))) return "actor";

    if (["lawrence","johansson","aniston","zendaya","winslet","robbie","ortega","bobby"].some(n=>name.includes(n))) return "actress";

    if (["weeknd","rihanna","gaga","beyonce","sheeran","swift","capaldi","harry","bieber","dua","billie","camila","mahmood"].some(n=>name.includes(n))) return "singer";

    if (["eminem","drake","kendrick","travis"].some(n=>name.includes(n))) return "rapper";

    if (["mark","musk","bezos"].some(n=>name.includes(n))) return "tech";

    if (["ninja","pokimane","kai","ibai","mrbeast"].some(n=>name.includes(n))) return "streamer";

    return "general";
}

// ================= IMAGE =================
function getImage(category){
    return categoryImages[category] || categoryImages.general;
}

// ================= STYLE =================
const styles = {
    football: {color:"#27ae60", icon:"⚽"},
    actor: {color:"#8e44ad", icon:"🎬"},
    actress: {color:"#e84393", icon:"🎭"},
    singer: {color:"#f39c12", icon:"🎤"},
    rapper: {color:"#d35400", icon:"🔥"},
    tech: {color:"#2980b9", icon:"💻"},
    streamer: {color:"#1abc9c", icon:"🎮"},
    general: {color:"#7f8c8d", icon:"⭐"}
};

// ================= GAME =================
let current = 0;
let clueIndex = 0;

function startGame(){
    document.getElementById("startScreen").classList.remove("active");
    document.getElementById("gameScreen").classList.add("active");
    nextPerson();
}

function applyStyle(item){
    const style = styles[item.category];
    document.body.style.background = style.color;
    document.getElementById("icon").textContent = style.icon;

    const badge = document.getElementById("badge");
    badge.textContent = item.category.toUpperCase();
    badge.style.background = style.color;
}

function nextClue(){
    if (clueIndex < data[current].clues.length){
        document.getElementById("clue").innerText = data[current].clues[clueIndex];
        clueIndex++;
    }
}

function reveal(){
    const item = data[current];

    document.getElementById("answer").innerText = item.answer;

    const img = document.getElementById("image");

    img.onerror = function() {
        this.src = categoryImages.general; // fallback image
    };

    img.src = item.image;
    img.classList.add("show");

    document.getElementById("revealSound").play();
}

function nextPerson(){
    current = Math.floor(Math.random() * data.length);
    clueIndex = 0;

    const item = data[current];

    item.category = getCategory(item.answer);
    item.image = getImage(item.category);

    applyStyle(item);

    document.getElementById("clue").innerText = "New person loaded!";
    document.getElementById("answer").innerText = "";

    const img = document.getElementById("image");
    img.classList.remove("show");
}
