<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Connect: The English Wall</title>
    <style>
        :root {
            --glow-color: #00d4ff;
            --tile-default: #1a1a2e;
            --tile-selected: #34495e;
            --tile-wrong: #441111;
            --timer-color: #00d4ff; 
            --cat-1: #2ecc71; 
            --cat-2: #f1c40f; 
            --cat-3: #9b59b6; 
        }

  body {
    background: #020205;
    color: white;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh; /* Changed from height: 100vh */
    margin: 0;
    padding: 10px;
    box-sizing: border-box;
}

#game-ui {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.wall-bg, .vignette {
    position: fixed; /* Changed from absolute to prevent background shifting */
    width: 100%; 
    height: 100%;
    top: 0; 
    left: 0;
    z-index: -1;
}
        .vignette {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.9) 100%);
            z-index: -1;
        }

        #game-container { text-align: center; width: 90%; max-width: 650px; position: relative; flex-grow: 1; display: flex; flex-direction: column; justify-content: center;}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px; /* Reduced gap slightly for small screens */
    margin: 15px auto;
    width: 100%;
    max-width: 500px;
    position: relative;
}

.tile {
    background: var(--tile-default);
    border: 2px solid var(--glow-color);
    padding: 20px 5px; /* Reduced vertical padding */
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s ease;
    text-transform: uppercase;
    font-size: clamp(0.85rem, 3vw, 1.1rem); /* Scales text automatically */
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    z-index: 1;
    user-select: none;
    -webkit-tap-highlight-color: transparent; /* Removes mobile tap flash */
}
        .tile.selected { background: var(--tile-selected); border-color: #fff; box-shadow: 0 0 15px var(--glow-color); }
        .tile.wrong { background: var(--tile-wrong) !important; border-color: #ff0000 !important; }
        .tile.solved-1 { background: var(--cat-1) !important; color: black; border-color: white; }
        .tile.solved-2 { background: var(--cat-2) !important; color: black; border-color: white; }
        .tile.solved-3 { background: var(--cat-3) !important; color: black; border-color: white; }

        /* New Progress Bar Styling */
        #timer-container {
            width: 200px;
            height: 6px;
            background: #1a1a2e;
            margin: 0 auto 20px auto;
            border-radius: 10px;
            border: 1px solid #333;
            overflow: hidden;
            display: none;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background: var(--glow-color);
            box-shadow: 0 0 10px var(--glow-color);
            transition: width 0.1s linear;
        }
        
        #lives { 
            font-size: 2.5rem; 
            color: #e94560; 
            margin: 10px 0 5px 0; 
            letter-spacing: 20px; 
            text-shadow: 0 0 15px rgba(233, 69, 96, 0.6);
        }

        #connection-reveal {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            min-height: 1.5em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--glow-color);
        }

        button {
            padding: 15px 30px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: 2px solid var(--glow-color);
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1rem;
        }

        button:hover { background: var(--glow-color); color: black; box-shadow: 0 0 20px var(--glow-color); }

        #msg-overlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 30px 50px;
            border: 3px solid var(--glow-color);
            border-radius: 10px;
            font-size: 2.5rem;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 0 50px var(--glow-color);
        }

        .footer {
            width: 100%;
            text-align: center;
            font-size: 7pt;
            color: #666;
            padding: 15px 0;
            z-index: 10;
        }

        .footer a { color: #888; text-decoration: none; }
        .footer a:hover { color: var(--glow-color); }
    </style>
</head>

<div class="wall-bg"></div>

    <div id="menu">
        <h1 style="text-shadow: 0 0 30px var(--glow-color); font-size: 4rem; margin-bottom: 10px;">THE ENGLISH WALL</h1>
        <label style="color:#ccc;"><input type="checkbox" id="timerToggle" checked style="transform: scale(1.6); vertical-align: middle;"> Timer</label>

    </div>

        <div class="grid" id="grid">

        </div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'correct') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(523, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(110, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'ping') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
            osc.start(); osc.stop(audioCtx.currentTime + 1);
        }
    }

    let selectedTiles = [], timeLeft = 120, timerInterval = null, isProcessing = false, mistakes = 0, currentWallSol = "";
    const TOTAL_TIME = 120;

    function startGame(diff) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const isTimed = document.getElementById('timerToggle').checked;
        const walls = wallLibrary[diff];
        const wall = walls[Math.floor(Math.random() * walls.length)];
        currentWallSol = wall.sol;
        mistakes = 0; 
        updateLives();
        document.getElementById('connection-reveal').innerText = "";
        document.getElementById('revealBtn').style.display = 'none';
        document.getElementById('solveBtn').style.display = 'inline-block';
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        const grid = document.getElementById('grid'), msg = document.getElementById('msg-overlay');
        grid.innerHTML = ''; grid.appendChild(msg);
        [...wall.data].sort(() => Math.random() - 0.5).forEach(item => {
            const div = document.createElement('div');
            div.className = 'tile'; div.innerText = item.w; div.dataset.cat = item.c;
            div.onclick = () => selectTile(div); grid.appendChild(div);
        });

        if (isTimed) {
            timeLeft = TOTAL_TIME;
            document.getElementById('timer-container').style.display = 'block';
            updateTimerBar();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerBar();
                if (timeLeft <= 0) {
                    playSound('ping');
                    solveWall("TIME UP!");
                }
            }, 1000);
        } else { 
            document.getElementById('timer-container').style.display = 'none'; 
        }
    }

    function updateTimerBar() {
        const percentage = (timeLeft / TOTAL_TIME) * 100;
        document.getElementById('timer-bar').style.width = percentage + "%";
    }

    function updateLives() {
        let display = "";
        for(let i=0; i<3; i++) display += (i < (3 - mistakes)) ? "● " : "○ ";
        document.getElementById('lives').innerText = display;
    }

    function selectTile(el) {
        if (isProcessing || el.classList.contains('solved-1') || el.classList.contains('solved-2') || el.classList.contains('solved-3') || (selectedTiles.length >= 3 && !el.classList.contains('selected'))) return;
        el.classList.toggle('selected');
        selectedTiles = Array.from(document.querySelectorAll('.tile.selected'));
        if (selectedTiles.length === 3) {
            isProcessing = true;
            const cat = selectedTiles[0].dataset.cat;
            if (selectedTiles.every(t => t.dataset.cat === cat)) {
                playSound('correct');
                selectedTiles.forEach(t => { t.classList.remove('selected'); t.classList.add(`solved-${cat}`); });
                isProcessing = false; selectedTiles = []; checkWin();
            } else {
                playSound('wrong'); mistakes++; updateLives();
                selectedTiles.forEach(t => { t.classList.remove('selected'); t.classList.add('wrong'); });
                setTimeout(() => {
                    if (mistakes >= 3) { solveWall("WALL LOCKED!"); } 
                    else { selectedTiles.forEach(t => t.classList.remove('wrong')); selectedTiles = []; isProcessing = false; }
                }, 600);
            }
        }
    }

    function solveWall(reason = "") {
        clearInterval(timerInterval); isProcessing = true;
        document.querySelectorAll('.tile').forEach(t => { t.className = 'tile'; t.classList.add(`solved-${t.dataset.cat}`); });
        document.getElementById('solveBtn').style.display = 'none';
        document.getElementById('connection-reveal').innerText = "WHAT CONNECTS THEM?";
        document.getElementById('revealBtn').style.display = 'inline-block';
        if (reason) {
            const overlay = document.getElementById('msg-overlay'); overlay.innerText = reason;
            overlay.style.display = 'block'; setTimeout(() => overlay.style.display = 'none', 2000);
        }
    }

    function checkWin() {
        if (document.querySelectorAll('[class*="solved-"]').length === 9) {
            clearInterval(timerInterval);
            document.getElementById('solveBtn').style.display = 'none';
            document.getElementById('connection-reveal').innerText = "WHAT CONNECTS THEM?";
            document.getElementById('revealBtn').style.display = 'inline-block';
            const overlay = document.getElementById('msg-overlay'); overlay.innerText = "WALL SOLVED!";
            overlay.style.display = 'block'; setTimeout(() => overlay.style.display = 'none', 2000);
        }
    }

    function revealConnections() {
        document.getElementById('connection-reveal').innerText = currentWallSol;
        document.getElementById('revealBtn').style.display = 'none';
    }
</script>
