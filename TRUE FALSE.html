<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Comprehension Challenge</title>

<style>
    :root {
        --primary: #6C63FF;
        --secondary: #FF6584;
        --success: #4CAF50;
        --neutral: #636E72;
        --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
        --card-bg: #ffffff;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg-gradient);
        margin: 0;
        padding: 16px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #2D3436;
    }

    #container {
        max-width: 800px;
        width: 100%;
        background: var(--card-bg);
        padding: 30px 24px;
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        animation: fadeIn 0.4s ease-out;
        margin-bottom: 40px;
        position: relative;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.97); }
        to { opacity: 1; transform: scale(1); }
    }

    /* Sound Toggle Switch */
    .sound-toggle {
        position: absolute;
        top: 20px;
        right: 20px;
        background: #f1f5f9;
        border: 1px solid #cbd5e1;
        border-radius: 20px;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: 600;
        color: #475569;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s ease;
    }

    .sound-toggle:hover {
        background: #e2e8f0;
    }

    h1 { 
        font-size: clamp(24px, 5vw, 32px); 
        color: #2D3436; 
        margin: 0 0 8px 0; 
        text-align: center;
        letter-spacing: 1px;
    }

    h2 { 
        font-size: clamp(15px, 3.5vw, 18px); 
        color: #636E72; 
        margin-bottom: 24px; 
        font-weight: normal; 
        text-align: center;
    }

    #q-image {
        width: 100%;
        max-height: 220px;
        height: auto;
        object-fit: contain;
        border-radius: 16px;
        margin-bottom: 18px;
        display: none;
        background: #f0f0f0;
    }

    button {
        padding: 14px 24px;
        margin: 6px 0;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 50px;
        border: none;
        transition: all 0.2s ease;
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        touch-action: manipulation;
    }

    button:active {
        transform: scale(0.98);
    }

    .level-btn { 
        background: var(--primary); 
        color: white; 
        width: 100%; 
        max-width: 300px; 
        display: block; 
        margin: 12px auto; 
        box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);
    }
    .level-btn:hover { background: #5a52d5; transform: translateY(-2px); }

    .answer-btn { 
        background: var(--secondary); 
        color: white; 
        width: 100%; 
        margin-top: 18px; 
        box-shadow: 0 4px 15px rgba(255, 101, 132, 0.3);
    }
    .answer-btn:hover { background: #e05572; }

    .next-btn { background: var(--success); color: white; flex: 1; }
    .home-btn { background: #dfe6e9; color: #2d3436; flex: 1; }

    .control-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        margin-top: 20px;
        gap: 12px;
    }

    #statement {
        font-size: clamp(15px, 4vw, 18px);
        line-height: 1.6;
        color: #2d3436;
        text-align: left;
        background: #f8fafc;
        padding: 18px 20px;
        border-left: 5px solid var(--primary);
        border-radius: 12px;
        min-height: 120px;
    }

    #result {
        font-size: clamp(22px, 5vw, 28px);
        margin-top: 15px;
        color: var(--primary);
        font-weight: 800;
        text-align: center;
    }

    #explanation {
        font-size: clamp(14px, 3.5vw, 16px);
        line-height: 1.5;
        color: #636e72;
        margin-bottom: 15px;
        text-align: center;
    }

    #progress {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        text-align: center;
        font-weight: 600;
    }

    .footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(15, 23, 42, 0.95);
        backdrop-filter: blur(8px);
        color: #94a3b8;
        text-align: center;
        padding: 8px 12px;
        font-size: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 100;
    }

    .footer a {
        color: #38bdf8;
        text-decoration: none;
    }

    @media (max-width: 480px) {
        #container {
            padding: 20px 16px;
            border-radius: 20px;
        }

        .control-row {
            flex-direction: column;
        }

        .control-row button {
            width: 100%;
        }
    }
</style>
</head>

<body>

<audio id="revealSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
<audio id="nextSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

<div id="container">
    <button id="soundToggle" class="sound-toggle" onclick="toggleSound()">🔊 Sound: ON</button>
    <div id="progress">Ready to start?</div>
    <h1>TRUE OR FALSE?</h1>
    
    <div id="home">
        <h2>Choose a difficulty level to begin the exercise.</h2>
        <button class="level-btn" onclick="startGame('easy')">Level 1: Basic</button>
        <button class="level-btn" onclick="startGame('advanced')">Level 2: Harder</button>
    </div>

    <div id="game" style="display:none;">
        <!-- Fallback image triggers if any source fails to load -->
        <img id="q-image" src="" onerror="this.src='dunno.jpg'" alt="Context Image">
        <div id="statement"></div>

        <button class="answer-btn" id="show-btn" onclick="showAnswer()">REVEAL ANSWER</button>

        <div id="answer-area">
            <div id="result"></div>
            <div id="explanation"></div>
        </div>

        <div class="control-row">
            <button class="next-btn" onclick="nextStatement()">Next Statement ➔</button>
            <button class="home-btn" onclick="goHome()">🏠 Menu</button>
        </div>
    </div>
</div>

<script>
let currentLevel = "";
let index = 0;

let soundEnabled = true;

    const btn = document.getElementById("soundToggle");
    if (soundEnabled) {
        btn.innerHTML = "🔊 Sound: ON";
    } else {
        btn.innerHTML = "🔇 Sound: OFF";
    }
}

            text: `Many people enjoy eating chocolate, and for a long time, people thought it was just a modern candy. However, chocolate has a very long history. The ancient Maya and Aztec people in Central America were drinking chocolate thousands of years ago. They didn't have sugar, so their chocolate drink was very bitter and spicy. They even used cocoa beans as a type of money to buy things.`,

            text: `The iconic Eiffel Tower, now the quintessential symbol of Paris, was initially conceived as a temporary exhibit for the 1889 Exposition Universelle. It faced intense opposition from the French artistic community, who viewed it as a 'monstrous' iron structure that threatened the city's architectural elegance. However, Gustave Eiffel secured its survival by demonstrating its utility as a wireless telegraph transmitter, effectively transforming an unwanted eyesore into a vital military and scientific asset.`,

            text: `The prevailing narrative surrounding the Amazon Rainforest often characterizes it as the 'lungs of the planet,' responsible for generating 20% of the world's oxygen supply. While the Amazon is undeniably critical for global biodiversity and carbon sequestration, this specific oxygen statistic is scientifically inaccurate. In reality, the rainforest consumes nearly all the oxygen it produces through its own respiration and the decomposition of organic matter, leaving the ocean's phytoplankton as our primary source.`,

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startGame(level) {
    currentLevel = level;
    index = 0;
    activeStatements = shuffleArray(statements[currentLevel]);
    
    document.getElementById("home").style.display = "none";
    document.getElementById("game").style.display = "block";
    loadStatement();
}

function loadStatement() {
    const s = activeStatements[index];
    document.getElementById("progress").innerText = `Question ${index + 1} of ${activeStatements.length}`;
    document.getElementById("statement").innerText = s.text;
    
    const imgEl = document.getElementById("q-image");
    imgEl.style.display = "block";
    imgEl.src = s.img;

    document.getElementById("result").innerText = "";
    document.getElementById("explanation").innerText = "";
    document.getElementById("show-btn").style.display = "inline-flex";
}

function showAnswer() {
    const s = activeStatements[index];
    document.getElementById("result").innerText = s.answer;
    document.getElementById("explanation").innerText = s.explanation;
    document.getElementById("show-btn").style.display = "none";
    
    if (soundEnabled) {
        const revealSound = document.getElementById("revealSound");
        revealSound.currentTime = 0;
        revealSound.play().catch(e => console.log('Audio play blocked:', e));
    }
}

function nextStatement() {
    if (soundEnabled) {
        const nextSound = document.getElementById("nextSound");
        nextSound.currentTime = 0;
        nextSound.play().catch(e => console.log('Audio play blocked:', e));
    }
    
    index++;
    if (index >= activeStatements.length) {
        document.getElementById("progress").innerText = "Success!";
        document.getElementById("statement").innerText = "You have reached the end of the level. Excellent reading comprehension today!";
        document.getElementById("q-image").style.display = "none";
        document.getElementById("result").innerText = "🏁 Done!";
        document.getElementById("explanation").innerText = "";
        document.getElementById("show-btn").style.display = "none";
        return;
    }
    loadStatement();
}

function goHome() {
    location.href = 'index.html';
}
</script>
